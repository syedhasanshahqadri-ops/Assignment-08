Enter<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.navbar {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 50px;
    border-bottom: 1px solid #ddd;
    font-family: Arial, sans-serif;
}


.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
}

.logo-box {
    font-size: 35px;
}

nav {
    display: flex;
    gap: 50px;
}

nav a {
    text-decoration: none;
    color: #111;
    font-size: 16px;
}


.buttons {
    display: flex;
    align-items: center;
    gap: 40px;
}

.buttons a {
    text-decoration: none;
    color: #111;
}

.buttons button {
    background-color: #111;
    color: white;
    border: none;
    padding: 16px 25px;
    border-radius: 7px;
    font-size: 15px;
}

    
  </style>
</head>
<body>

  <header class="navbar">

    <div class="logo">
        <div class="logo-box">◇</div>
        <b>Shadcnblocks.com</b>
    </div>

    <nav>
        <a href="#">Products⌄</a>
        <a href="#">Company⌄</a>
        <a href="#">Contact</a>
    </nav>

    <div class="buttons">
        <a href="#">Log in</a>
        <button>Sign up</button>
    </div>

  </header>
  
</body>
</html>
